{% extends "base.html" %}
{% block title %}Create account — Spendly{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-container">

    <a href="{{ url_for('landing') }}" class="auth-logo">
      <span class="auth-logo-icon-wrap">◈</span>
      <span class="auth-logo-name">Spendly</span>
    </a>

    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Start tracking your finances for free</p>
      </div>

      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/register">
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" class="form-input"
                 placeholder="Your name" required autofocus>
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" class="form-input"
                 placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="Min. 8 characters" required>
        </div>
        <button type="submit" class="btn-submit" style="margin-top:0.25rem">Create account</button>
      </form>
    </div>

    <p class="auth-switch">
      Already have an account?
      <a href="{{ url_for('auth.login') }}">Sign in →</a>
    </p>

  </div>
</div>
{% endblock %}
